name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        # md5 in pg_hba asks each user for the kind of password it stores:
        # SCRAM for postgres, MD5 for blink_md5 below.
        env:
          POSTGRES_PASSWORD: blink
          POSTGRES_HOST_AUTH_METHOD: md5
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      BEND_VERSION: "2.0.40"
      BEND_SHA256: c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
      BEND_NO_TELEMETRY: "1"
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: blink
      PGDATABASE: postgres
      BLINK_LIVE: "1"
      BLINK_AUTH: "postgres:blink blink_md5:md5pass"
      BLINK_VERDICT: "1"
    steps:
      - uses: actions/checkout@v7

      # The pinned release, laid out as bend-lang.com/install.sh lays it out.
      - name: Install Bend
        run: |
          curl -fsSL -o bend.tgz "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/bend-$BEND_VERSION-linux-x64.tar.gz"
          echo "$BEND_SHA256  bend.tgz" | sha256sum -c -
          tar -xzf bend.tgz
          mkdir -p ~/.bend
          mv bend/bend2 bend/guide bend/bin ~/.bend/
          rm -rf bend bend.tgz
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"

      # For --verdict: Lean, and BendTT's kernel, which bend builds with it
      # on first use.
      - name: Cache Lean and BendTT's kernel
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            ~/.bend/bendtt
          key: lean-4.34.0-bend-${{ env.BEND_VERSION }}

      - name: Install Lean
        run: |
          [ -x ~/.elan/bin/lean ] || curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --no-modify-path --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Tools
        run: bend version && lean --version && clang --version | head -1 && psql --version

      - name: An MD5 user
        run: psql -c "SET password_encryption = 'md5'" -c "CREATE USER blink_md5 PASSWORD 'md5pass'"

      - name: Laws, replay, vectors and live checks
        run: scripts/test.sh
